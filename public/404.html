<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found · designon</title>
<!-- Its presence makes Cloudflare Pages answer unknown paths with 404 instead of
     index.html. Without it, a script requested in the seconds after a deploy
     came back as HTML and browsers cached a blank page for hours. -->
<style>
  html, body { margin: 0; height: 100%; background: #f4f1ea; color: #26383f; font: 16px/1.5 system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: left; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; font-size: 16px; max-width: 34ch; }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; width: fit-content; background: #26383f; color: #f4f1ea; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Nothing is drawn here.</h1>
  <p>This address does not exist on designon. Your sketches are safe in this browser.</p>
  <a href="/">Back to the drawing</a>
</main>
</body>
</html>
