name = "luma-concept-render"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# One SQLite-backed coordinator reserves quota atomically before upstream calls.
[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

[[migrations]]
tag = "ai-quota-v1"
new_sqlite_classes = ["AiQuota"]

[vars]
# AI endpoints are currently disabled — every public Gemini model
# (`gemini-1.5-flash`, `gemini-2.0-flash`, `gemini-3.8-flash*`) returns
# 404 "no longer served to new API accounts" to the key bound to this
# worker. The handler returns a fast 503 with the local-only guidance
# when these vars are empty. Re-enable by setting a real model name and
# `npx wrangler deploy`. No code change required.
GEMINI_MODEL = ""
TRACE_MODEL = ""
DAILY_IP_LIMIT = "20"
DAILY_GLOBAL_LIMIT = "200"
