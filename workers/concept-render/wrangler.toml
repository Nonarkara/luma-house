name = "luma-concept-render"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# One SQLite-backed coordinator reserves quota atomically before upstream calls.
[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

[[migrations]]
tag = "ai-quota-v1"
new_sqlite_classes = ["AiQuota"]

[vars]
GEMINI_MODEL = "gemini-3.8-flash-image"
# gemini-2.5-flash is no longer served to new API accounts, so the old hardcoded
# vision model 404s for anyone setting this up fresh. Both models live here so
# a retirement is a config change rather than a code deploy.
TRACE_MODEL = "gemini-3.8-flash"
DAILY_IP_LIMIT = "20"
DAILY_GLOBAL_LIMIT = "200"
