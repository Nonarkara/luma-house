name = "luma-concept-render"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# One SQLite-backed coordinator reserves quota atomically before upstream calls.
[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

[[migrations]]
tag = "ai-quota-v1"
new_sqlite_classes = ["AiQuota"]

[vars]
# Both endpoints default to gemini-2.0-flash because the newer
# `gemini-3.8-flash*` models return 404 ("no longer served to new API
# accounts") to the key bound to this worker. The previous-generation
# 2.0 model is the conservative fallback that still answers; swap these
# vars (no redeploy of code needed) if either model is retired again.
GEMINI_MODEL = "gemini-2.0-flash"
TRACE_MODEL = "gemini-2.0-flash"
DAILY_IP_LIMIT = "20"
DAILY_GLOBAL_LIMIT = "200"
