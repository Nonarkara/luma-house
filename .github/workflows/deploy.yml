name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: workers/concept-render
      - run: npm run check
        working-directory: workers/concept-render
      - run: npm run test:quota
        working-directory: workers/concept-render
      - run: npm audit --audit-level=high
        working-directory: workers/concept-render
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Shipability smoke, in a real browser. This must run AFTER the build:
      # playwright.config boots `npm run preview`, which serves dist/, and a
      # fresh checkout has no dist until the step above. Gating the deploy on
      # this is the point — the three regressions it covers (welcome gate
      # destroying an opened share link, and Share / New sketch / Furniture
      # Catalog hidden on phones) all passed the 284 vitest cases.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist
  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
